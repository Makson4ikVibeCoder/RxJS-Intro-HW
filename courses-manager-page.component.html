<div class="manager-container">
  <h2>Керування курсами</h2>

  <form [formGroup]="courseForm" (ngSubmit)="addCourse()" class="course-form">
    <input formControlName="title" placeholder="Назва курсу" required />
    <input formControlName="category" placeholder="Категорія" required />
    <input formControlName="duration" placeholder="Тривалість (напр. 10h)" required />
    <button type="submit" [disabled]="courseForm.invalid">Додати курс</button>
  </form>

  <ul class="course-list">
    <li *ngFor="let course of courses$ | async" class="course-item">
      <div>
        <strong>{{ course.title }}</strong>
        <p>Категорія: {{ course.category }} | Тривалість: {{ course.duration }}</p>
      </div>
      <button (click)="deleteCourse(course.id)" class="delete-btn">Видалити</button>
    </li>
  </ul>
</div>
